<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باغ درون من</title>
<meta name="description" content="رشد آرام، قدم‌های کوچک">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e2;--card:#fffaf0;--ink:#3a3a2a;--mut:#7a7560;--olive:#5f6f33;--sage:#a9b898;--brown:#b08a5b;--orange:#e8a15e;--line:#e4dac3;--g:#8aa36b;--y:#e6c76a;--b:#7f9bb5;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1d2017;--card:#292d20;--ink:#ece6d2;--mut:#aaa58d;--olive:#a9bf6a;--line:#3d4230;--sage:#6f7f5e;--on:#1d2017;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 Vazirmatn,Tahoma,sans-serif}
h1,h2,h3{font-weight:800;margin:0 0 .4rem;line-height:1.4}h2{font-size:1.15rem}h3{font-size:1rem}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 96px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:.68rem;padding:4px 2px;flex:1;white-space:nowrap;border-radius:10px;cursor:pointer}
nav button.on{color:var(--on);background:var(--olive)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.hero{border-radius:0 0 28px 28px;overflow:hidden;margin:0 -14px 14px;position:relative}
.hero svg{display:block;width:100%;height:auto}
.hero .tx{position:absolute;inset:auto 18px 14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hero b{font-size:1.3rem;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.88rem;color:var(--mut);margin:8px 0 2px}
.btn{background:var(--olive);color:var(--on);border:0;border-radius:12px;padding:7px 14px;cursor:pointer}
.btn.q{background:none;color:var(--olive);border:1px solid var(--sage)}
.ic{background:none;border:0;cursor:pointer;color:var(--mut);padding:2px 6px;border-radius:8px}
.ic:hover,.ic.on{color:var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.seg button{flex:1;min-width:90px;border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer;color:#2c2c20}
.seg button.on{border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
.tk{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line)}
.tk .tx{flex:1;border-color:transparent;background:none;min-width:0}
.tk.dn .tx{text-decoration:line-through;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mut{color:var(--mut);font-size:.88rem}
.note{background:color-mix(in srgb,var(--sage) 25%,var(--card));border-radius:12px;padding:8px 12px;font-size:.9rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--olive);color:var(--on)}
.tag{display:inline-block;font-size:.78rem;border-radius:8px;padding:0 8px;background:var(--sage);color:#26301a}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
@media(prefers-reduced-motion:no-preference){.hero svg circle{transition:cy .6s ease}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),fa=n=>Number(n).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=(d,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d);
const pd=k=>{const[a,b,c]=k.split('-');return new Date(+a,+b-1,+c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const CATS={job:['شغل','#b08a5b'],learn:['یادگیری','#6b7a3a'],content:['تولید محتوا','#e8a15e'],health:['سلامت','#8aa36b'],spirit:['معنویت','#7f9bb5'],personal:['امور شخصی','#a9b898']};
const FEEL=[['آرام','#a9c3a0'],['امیدوار','#e6c76a'],['سپاسگزار','#e8a15e'],['پرانرژی','#8aa36b'],['خسته','#b9ad94'],['مضطرب','#c9b79c'],['غمگین','#8fa5b8'],['گیج','#b0a7c0']];
const STEPS=[
['مرور Python','روان‌شدن در نوشتن کدهای کوچک','متغیر، شرط، حلقه، تابع، فایل','حل یک تمرین کوچک (مثلاً ماشین‌حساب یا لیست کارها)','اسکریپت مدیریت فایل‌ها'],
['Git و GitHub','ذخیره و اشتراک‌گذاری کد با تاریخچه','commit، branch، push، pull request','ساخت یک مخزن و چند commit','مخزن پورتفولیوی اولیه با README'],
['JSON و API','خواندن داده از سرویس‌های آنلاین','ساختار JSON، HTTP، requests، کلید API','فراخوانی یک API عمومی و نمایش نتیجه','اسکریپت دریافت آب‌وهوا یا قیمت'],
['SQL و پایگاه داده','ذخیره و پرس‌وجوی داده','SELECT، JOIN، INSERT، SQLite','ساخت جدول و چند پرس‌وجو','ردیاب ساده با SQLite'],
['n8n و Workflow','ساخت اتوماسیون بصری','trigger، node، webhook، شرط','ساخت یک workflow دو مرحله‌ای','اتوماسیون ارسال خلاصه روزانه'],
['FastAPI','ساخت API خودم','route، مدل داده، اعتبارسنجی، مستندات خودکار','ساخت یک endpoint ساده','سرویس کوچک برای یکی از workflowها'],
['ابزارهای AI و LLM API','استفاده از مدل‌های زبانی در پروژه','prompt، پارامترها، خروجی ساختاریافته','ارسال یک prompt از کد و پردازش پاسخ','ابزار خلاصه‌ساز متن'],
['RAG و AI Agents','پاسخ‌گویی بر پایه اسناد و استفاده از ابزارها','embedding، جستجوی برداری، chunking، tool calling','ساخت RAG روی چند سند','پرسش‌وپاسخ روی یادداشت‌های خودم'],
['خطا، امنیت، استقرار','قابل‌اعتماد کردن پروژه‌ها','try/except، متغیر محیطی، Docker، لاگ، مستندسازی','استقرار یک سرویس کوچک','انتشار یک پروژه با مستندات'],
['پورتفولیو و بازار کار','نمایش مهارت‌ها','انتخاب ۳ پروژه، رزومه، لینکدین، روایت پروژه','نوشتن توضیح یک پروژه برای دیگران','سایت یا صفحه پورتفولیو']
];
const KEY='bagh-daroon-v1';
let warn='';
function init(){return{set:{kinds:[1,1,1,1,1,2,0].map((v,i)=>[1,1,1,1,2,0,1][i]===undefined?v:[1,1,1,1,2,0,1][i]),wake:'06:30',ws:'08:00',we:'17:00',learn:40,content:30},days:{},rm:STEPS.map((_,i)=>({st:i?'todo':'doing',note:''})),cont:[],jr:[],rev:{}}}
// kinds by JS getDay(): 0 Sun .. 6 Sat ; 0 work,1 ... see KINDS below
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.set)return r}catch(e){warn='خواندن داده‌های ذخیره‌شده ممکن نشد؛ با داده خالی شروع شد.'}return init()}
function save(){S.ts=Date.now();delete S.fresh;syncSoon();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){warn='ذخیره در مرورگر ممکن نیست؛ تغییرات فقط تا بستن صفحه می‌مانند.';render()}}
let S=load();
// kinds: 0=کاری 1=سبک 2=استراحت ; default Sat–Wed work, Thu light, Fri rest
if(!localStorage.getItem(KEY)){S.set.kinds=[0,0,0,0,1,2,0];S.fresh=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const KINDS=['روز کاری','روز سبک','روز استراحت'];
const D=k=>S.days[k]||(S.days[k]={type:'',energy:null,feel:'',prios:['','',''],tasks:[],win:'',gr:''});
const uid=()=>Math.random().toString(36).slice(2,9);
let view='today',showAll=false,msg='',tm={left:25*60,run:false,iv:null},chartN=7,cf={},resetAsk=false,expText='';
const today=()=>iso(new Date());
const VIEWS=[['today','امروز'],['week','هفته'],['road','مسیر'],['content','محتوا'],['mood','احساس'],['calm','روتین‌ها'],['ther','تمرین‌ها'],['set','تنظیمات']];

function hero(t,d){
 const sky={g:['#cfe3b8','#f6e7c1'],y:['#f1dfb0','#f4cf9c'],b:['#a9bccd','#cdd6df'],'':['#dfe8cf','#f6ecd0']}[t||''];
 const night=t==='b',sy=night?34:t==='y'?60:40;
 const h=new Date().getHours();const gr=h<5?'شب آرام':h<12?'صبح بخیر':h<17?'ظهر بخیر':h<21?'عصر بخیر':'شب آرام';
 return `<div class="hero"><svg viewBox="0 0 600 220" role="img" aria-label="منظره باغ"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="600" height="220" fill="url(#sk)"/>
 <circle cx="${night?470:130}" cy="${sy}" r="${night?20:28}" fill="${night?'#f3efe0':'#e8a15e'}"/>${night?'<circle cx="480" cy="30" r="17" fill="#a9bccd"/>':''}
 <path d="M0 170 Q120 90 230 150 T430 130 T600 150 V220 H0Z" fill="#a9b898"/><path d="M0 195 Q150 140 300 185 T600 170 V220 H0Z" fill="#6b7a3a"/>
 <path d="M300 190 q0-26 -2-40 M298 158 q-22-4 -26 -20 q22 0 26 20 M298 152 q20-6 24-22 q-22 2 -24 22" stroke="#e9f0d6" stroke-width="3" fill="#e9f0d6" stroke-linecap="round"/></svg>
 <div class="tx"><b>${gr}</b>${fmt(pd(d),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}<br><small>رشد آرام، قدم‌های کوچک</small></div></div>`}

function taskRow(k,t,i,isToday){return `<li class="tk${t.done?' dn':''}"><input type="checkbox" data-p="days.${k}.tasks.${i}.done" data-r="1" ${t.done?'checked':''} aria-label="انجام شد"><i class="dot" style="background:${CATS[t.cat][1]}" title="${CATS[t.cat][0]}"></i><input type="text" class="tx" data-p="days.${k}.tasks.${i}.t" value="${esc(t.t)}" aria-label="عنوان کار">`+
 (isToday?`<button class="ic${t.p?' on':''}" data-a="pri" data-k="${k}" data-i="${i}" title="اولویت مهم" aria-label="اولویت">★</button><button class="ic" data-a="tmr" data-k="${k}" data-i="${i}" title="ببر به فردا">فردا</button>`:
 `<select data-mv="${k}|${i}" style="width:auto" aria-label="انتقال"><option value="">انتقال…</option>${weekKeys().filter(x=>x!==k).map(x=>`<option value="${x}">${fmt(pd(x),{weekday:'short'})}</option>`).join('')}</select>`)+
 `<button class="ic" data-a="del" data-k="${k}" data-i="${i}" aria-label="حذف">✕</button></li>`}
function weekKeys(){const n=new Date(),s=addD(n,-((n.getDay()+1)%7));return[...Array(7)].map((_,i)=>iso(addD(s,i)))}
function curStep(){const i=S.rm.findIndex(r=>r.st==='doing');return i<0?S.rm.findIndex(r=>r.st==='todo'):i}

function vToday(){const k=today(),d=D(k),hard=d.type==='b';
 let list=d.tasks.map((t,i)=>[t,i]);
 if(hard&&!showAll){let m=list.filter(([t])=>t.p);if(!m.length)m=list.filter(([t])=>!t.done).slice(0,3);list=m}
 const cs=curStep(),hasLearn=d.tasks.some(t=>t.cat==='learn'||t.cat==='content');
 const sug=cs>=0&&!hard&&!hasLearn&&S.set.kinds[new Date().getDay()]!==2;
 const tp=[...Array(3)].map((_,i)=>`<input type="text" data-p="days.${k}.prios.${i}" value="${esc(d.prios[i])}" placeholder="اولویت ${fa(i+1)}" aria-label="اولویت ${fa(i+1)}">`).join('');
 return hero(d.type,k)+`
 <div class="card" style="border-color:var(--olive);text-align:center"><h3 class="mut" style="font-weight:600">نیت من</h3><textarea data-p="set.intent" aria-label="نیت من" style="border-color:transparent;background:none;text-align:center;font-size:1.15rem;font-weight:600;line-height:1.9;min-height:84px;resize:none">${esc(S.set.intent??'درد یا لذت کاری که انجام دادی نمی مونه اما افتخار یا شرمندگیش چرا')}</textarea>${((S.log&&S.log.int)||[]).filter(e=>e.d===k).slice(-1).map(e=>`<p class="mut" style="margin:0">نیت امروز: ${esc(e.t||e.n)}</p>`).join('')}</div>
 <div class="card"><h2>امروز چه‌طور است؟</h2><div class="row seg" role="group" aria-label="نوع روز">
 ${[['g','سبز: انرژی خوب','var(--g)'],['y','زرد: انرژی متوسط','var(--y)'],['b','آبی: روز سخت','var(--b)']].map(([v,l,c])=>`<button style="background:${c}" class="${d.type===v?'on':''}" data-a="type" data-v="${v}">${l}</button>`).join('')}</div>
 ${hard?'<p class="note">امروز روز سخت است و همین کافی است. فقط کارهای ضروری پیدا هستند؛ بقیه جایی نمی‌روند و کسی از تو حساب نمی‌خواهد.</p>':''}
 <label for="en">انرژی: <b>${d.energy==null?'ثبت نشده':fa(d.energy)}</b></label><input id="en" type="range" min="1" max="10" value="${d.energy??5}" data-p="days.${k}.energy" data-r="1" style="width:100%">
 <div class="row" style="margin-top:6px">${FEEL.map(([f])=>`<button class="chip${d.feel===f?' on':''}" data-a="feel" data-v="${f}">${f}</button>`).join('')}</div></div>
 <div class="card"><h2>سه چیزِ مهمِ امروز</h2><div class="grid">${tp}</div></div>
 <div class="card"><h2>برنامه امروز</h2>
 ${sug?`<p class="note">پیشنهاد (فقط اگر دوست داشتی): «${esc(STEPS[cs][3])}»، حدود ${fa(S.set.learn)} دقیقه. <button class="btn q" data-a="sug">افزودن به امروز</button></p>`:''}
 <ul>${list.map(([t,i])=>taskRow(k,t,i,true)).join('')||'<li class="mut">هنوز کاری نیست. یک قدم کوچک اضافه کن.</li>'}</ul>
 ${hard&&d.tasks.length>list.length?`<button class="btn q" data-a="showall">${showAll?'فقط ضروری‌ها':'نمایش بقیه'}</button>`:''}
 <div class="row" style="margin-top:10px"><input type="text" id="nt" placeholder="کار تازه…" style="flex:2;min-width:140px" aria-label="کار تازه"><select id="nc" style="flex:1;min-width:110px" aria-label="دسته">${Object.entries(CATS).map(([c,v])=>`<option value="${c}">${v[0]}</option>`).join('')}</select><button class="btn" data-a="add" data-k="${k}">افزودن</button></div>
 ${msg?`<div class="mut" role="alert">${msg}</div>`:''}</div>
 <div class="card"><h2>تمرکز اختیاری</h2><div class="row"><b id="tm" style="font-size:1.6rem">${tmTxt()}</b>
 <select id="tmsel" style="width:auto" ${tm.run?'disabled':''}>${[15,25,45].map(m=>`<option value="${m}"${tm.left===m*60||(!tm.run&&tm.left===m*60)?' selected':''}>${fa(m)} دقیقه</option>`).join('')}</select>
 <button class="btn" data-a="tm">${tm.run?'توقف':'شروع'}</button></div></div>
 <div class="card"><h2>پایان روز (هر وقت خواستی)</h2>
 <label>یک موفقیت کوچک</label><input type="text" data-p="days.${k}.win" value="${esc(d.win)}">
 <label>یک مورد شکرگزاری</label><input type="text" data-p="days.${k}.gr" value="${esc(d.gr)}"></div>`}
function tmTxt(){const m=Math.floor(tm.left/60),s=tm.left%60;return fa(m)+':'+(s<10?'۰':'')+fa(s)}

function vWeek(){const ks=weekKeys(),ws=ks[0],r=S.rev[ws]||(S.rev[ws]={});
 return `<h1 style="margin-top:18px">برنامه هفته</h1><p class="mut">هیچ کاری خودکار جابه‌جا نمی‌شود؛ هر انتقال با انتخاب خودت است. حداکثر سه اولویت برای هر روز.</p><div class="grid">`+
 ks.map(k=>{const d=D(k),dt=pd(k),kind=S.set.kinds[dt.getDay()];
 return `<div class="card" style="${k===today()?'border-color:var(--olive)':''}"><h3>${fmt(dt,{weekday:'long',day:'numeric',month:'long'})}</h3><span class="tag">${KINDS[kind]}</span>
 <ul>${d.tasks.map((t,i)=>taskRow(k,t,i,false)).join('')}</ul>
 <div class="row" style="margin-top:6px"><input type="text" data-wk="${k}" placeholder="کار تازه…" style="flex:1" aria-label="کار تازه"><button class="btn q" data-a="wadd" data-k="${k}">+</button></div></div>`}).join('')+`</div>
 <div class="card"><h2>مرور هفتگی</h2>
 ${[['prog','چه پیشرفت‌هایی داشتم؟'],['obs','چه چیزی سد راهم بود؟'],['en','انرژی‌ام این هفته چه‌طور بود؟'],['good','چه لحظه‌های خوبی داشتم؟'],['next','هفته بعد چه چیزی را ساده‌تر کنم؟']].map(([f,l])=>`<label>${l}</label><textarea data-p="rev.${ws}.${f}">${esc(r[f])}</textarea>`).join('')}</div>`}

function vRoad(){const cs=curStep();
 return `<h1 style="margin-top:18px">مسیر یادگیری AI Automation</h1><p class="mut">مرحله فعلی: ${cs>=0?esc(STEPS[cs][0]):'همه مرحله‌ها کامل شده‌اند'}. فقط مرحله فعلی در پیشنهاد روزانه می‌آید. می‌توانی وضعیت و یادداشت هر مرحله را عوض کنی.</p>`+
 STEPS.map((s,i)=>{const r=S.rm[i];return `<div class="card"><details ${i===cs?'open':''}><summary>${fa(i+1)}. ${s[0]} <span class="tag">${{todo:'شروع نشده',doing:'در حال انجام',done:'انجام شد'}[r.st]}</span></summary>
 <p><b>هدف:</b> ${s[1]}</p><p><b>موضوعات:</b> ${s[2]}</p><p><b>تمرین عملی:</b> ${s[3]}</p><p><b>پروژه کوچک:</b> ${s[4]}</p>
 <label>وضعیت</label><select data-p="rm.${i}.st" data-r="1"><option value="todo"${r.st==='todo'?' selected':''}>شروع نشده</option><option value="doing"${r.st==='doing'?' selected':''}>در حال انجام</option><option value="done"${r.st==='done'?' selected':''}>انجام شد</option></select>
 <label>یادداشت</label><textarea data-p="rm.${i}.note">${esc(r.note)}</textarea>
 <button class="btn q" style="margin-top:8px" data-a="idea" data-i="${i}">تبدیل به ایده محتوا</button></details></div>`}).join('')}

const ST=[['idea','ایده'],['prep','در حال آماده‌سازی'],['ready','آماده انتشار'],['pub','منتشرشده']];
function vContent(){
 return `<h1 style="margin-top:18px">تولید محتوا</h1><p class="note">هفته سبک پیشنهادی: یک روز ایده‌پردازی، یک روز تولید، یک روز انتشار. وضعیت «منتشرشده» را فقط خودت ثبت می‌کنی؛ جایی خودکار منتشر نمی‌شود.</p>

 <div class="card"><h2>خروجی داده‌ها</h2><p class="mut">داده‌ها فقط در همین مرورگر ذخیره می‌شوند و با پاک‌کردن اطلاعات مرورگر از بین می‌روند. برای نگه‌داشتن نسخه پشتیبان، متن را کپی کن.</p>

function bars(v,unit){const mx=Math.max(1,...v),w=280/ln,X=i=>10+(ln-1-i)*w;return `<svg viewBox="0 0 300 80" style="width:100%" role="img" aria-label="نمودار"><path d="M10 62H290" stroke="var(--line)"/>${v.map((x,i)=>`<rect x="${X(i)+w*.15}" y="${62-x/mx*52}" width="${w*.7}" height="${x/mx*52}" rx="3" fill="var(--sage)"/>`).join('')}${ln===7?v.map((x,i)=>`<text x="${X(i)+w/2}" y="76" font-size="9" text-anchor="middle" fill="var(--mut)">${fmt(addD(new Date(),i-6),{weekday:'narrow'})}</text>`).join(''):''}</svg><p class="mut">مجموع: ${fa(v.reduce((a,b)=>a+b,0))} ${unit}</p>`}
function ser(f){return [...Array(ln)].map((_,i)=>f(iso(addD(new Date(),i-ln+1))))}
function logSum(key){const u=LOGS[key][2];return ser(k=>S.log[key].filter(e=>e.d===k).reduce((a,e)=>a+(u==='min'?e.m:1),0))}
function vCalm(){
 const tabs=`<div class="row" style="margin-top:14px"><button class="chip${lt==='ov'?' on':''}" data-a="lt" data-v="ov">نمای کلی</button>${Object.entries(LOGS).map(([k,v])=>`<button class="chip${lt===k?' on':''}" data-a="lt" data-v="${k}">${v[0]}</button>`).join('')}<button class="chip${lt==='hb'?' on':''}" data-a="lt" data-v="hb">علاقه‌های اختیاری<button class="chip${lt==='wt'?' on':''}" data-a="lt" data-v="wt">وزن</button><button class="chip${lt==='ph'?' on':''}" data-a="lt" data-v="ph">فاصله از گوشی</button></div>`;

 if(S.custom.some(c=>c.id===lt&&c.kind==='chk'))return vChk(tabs,rng);
 const [name,ph,u]=LOGS[lt],L=S.log[lt],isMed=lt==='med';
 const form=isMed?`<label>روتین</label><select id="l1"><option value="">بدون روتین (آزاد)</option>${S.routines.map(r=>`<option>${esc(r.t)}</option>`).join('')}</select><label>مدت</label><select id="l2">${[1,3,5,10,15,20].map(m=>`<option value="${m}">${fa(m)} دقیقه</option>`).join('')}</select>`
  :`<label>${u==='min'?'عنوان':'عنوان یا جمله'}</label><input type="text" id="l1" placeholder="${ph}">${u==='min'?'<label>مدت (دقیقه)</label><input type="number" id="l2" min="0" max="600" value="15">':''}`;
 const routines=isMed?`<div class="card"><h2>روتین‌های خودم</h2><p class="mut">متن مدیتیشن را خودت بنویس؛ هر وقت خواستی همین‌جا بخوان و ویرایشش کن.</p>${S.routines.map((r,i)=>`<details><summary>${esc(r.t)}</summary><label>عنوان</label><input type="text" data-p="routines.${i}.t" value="${esc(r.t)}"><label>متن</label><textarea data-p="routines.${i}.text" style="min-height:140px">${esc(r.text)}</textarea><button class="ic" data-a="rdel" data-i="${i}">حذف روتین</button></details>`).join('')||'<p class="mut">هنوز روتینی ننوشته‌ای.</p>'}<label>عنوان روتین تازه</label><input type="text" id="r1"><label>متن روتین</label><textarea id="r2" style="min-height:120px"></textarea><button class="btn" style="margin-top:8px" data-a="radd">افزودن روتین</button></div>`:'';

 <div class="card"><h3>آخرین ثبت‌ها</h3>${L.slice(-8).reverse().map(e=>`<details><summary>${fmt(pd(e.d),{day:'numeric',month:'long'})}${e.t?' · '+esc(e.t):''}${u==='min'?' · '+fa(e.m)+' دقیقه':''}</summary><p>${esc(e.n)}</p><button class="ic" data-a="ldel" data-id="${e.id}">حذف</button></details>`).join('')||'<span class="mut">خالی</span>'}</div>`}
function THER0(){return{logs:[],ex:[{id:'anx',t:'نوشتن دلیل اضطراب',kind:'write',prompts:['دلیل اضطراب من الان این است…']},{id:'dg',t:'سه‌تا دمت گرم امروز',kind:'write',prompts:['دمت گرم برای… (۱)','دمت گرم برای… (۲)','دمت گرم برای… (۳)']},{id:'b1',t:'تنفس مربعی ۴-۴-۴-۴',kind:'breath',pat:[4,4,4,4],rounds:5},{id:'b2',t:'تنفس ۴-۷-۸',kind:'breath',pat:[4,7,8,0],rounds:4},{id:'b3',t:'دم کوتاه، بازدم بلند',kind:'breath',pat:[4,0,6,0],rounds:6}]}}
